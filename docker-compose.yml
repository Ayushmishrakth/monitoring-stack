version: "3.9"

services:
  sample-app:  
    build: ./sample-app
    container_name: sample-app
    ports:
      - "50080:80"         # Windows-safe host port
    networks:
      - monitoring-stack_monitoring   # updated network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "59090:9090"       # Windows-safe host port
    networks:
      - monitoring-stack_monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "53000:3000"       # Windows-safe host port
    networks:
      - monitoring-stack_monitoring
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "53100:3100"       # Windows-safe host port
    networks:
      - monitoring-stack_monitoring

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring-stack_monitoring
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "59100:9100"       # Windows-safe host port
    networks:
      - monitoring-stack_monitoring

  ai-monitoring-app:
    build: ./ai-monitoring-app
    container_name: ai-monitoring-app
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-stack_monitoring
    command: sh -c "while true; do python ai_analyzer/analyze.py; sleep 10; done"
    
networks:
  monitoring-stack_monitoring:
    external: true
