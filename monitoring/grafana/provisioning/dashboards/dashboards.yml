# Dashboard Provider Configuration
# ─────────────────────────────────
# Tells Grafana where to find dashboard JSON files on disk.

apiVersion: 1

providers:
  - name: 'APM Dashboards'
    orgId: 1
    folder: 'APM Platform'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
